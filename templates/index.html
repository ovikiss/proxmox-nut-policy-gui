<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="/styles-modern.css" id="theme-style-css">
  <style>
    :root{--ups-accent:#73a7ff;--ups-green:#35d98b}.dashboard-container{max-width:1340px;margin:0 auto;padding:30px 52px 40px}.section{margin-top:20px}.ups-card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:17px;box-shadow:var(--glass-shadow,var(--shadow))}.ups-connection{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.ups-connection h2{grid-column:1/-1}.ups-connection label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.8125em}.ups-connection input,.ups-connection textarea{background:var(--card-strong);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 10px;font:inherit}.ups-connection textarea{min-height:90px;resize:vertical}.ups-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.ups-stat{height:119px}.ups-label{font-size:.875em;color:var(--muted);text-transform:uppercase}.ups-value{font-size:2.0625em;font-weight:700;margin-top:16px}.ups-policy{display:flex;align-items:center;gap:34px;min-height:119px}.ups-policy h2{margin-right:auto}.ups-policy p{margin:0;font-size:1.125em}.ups-input{width:76px;background:var(--card-strong);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1em;padding:8px 12px;text-align:center}.ups-vm-card{padding:16px 17px 12px}.ups-card h2{font-size:1.375em;margin:0 0 10px}.ups-table-head,.ups-vm-row{display:grid;grid-template-columns:78px 1.6fr 180px 175px 170px;gap:15px;align-items:center}.ups-table-head{color:var(--muted);padding:0 3px 7px;border-bottom:1px solid var(--table-border,var(--border))}.ups-vm-row{min-height:74px;border-bottom:1px solid var(--table-border,var(--border))}.ups-vm-row:last-of-type{border-bottom:0}.ups-vm-name{font-size:1.0625em}.ups-vm-meta{color:var(--muted);font-size:.875em;margin-top:3px}.ups-status.running{color:var(--ups-green)}.ups-status.stopped{color:var(--muted)}.ups-check{appearance:none;width:22px;height:22px;border:1px solid #3d4655;border-radius:5px;background:var(--card-strong);position:relative;margin-left:8px}.ups-check:checked{border-color:var(--ups-accent)}.ups-check:checked:after{content:"\2713";position:absolute;color:var(--ups-accent);font-size:1.25em;left:3px;top:-3px}.ups-field{display:flex;align-items:center;gap:12px}.ups-field .ups-input{width:77px}.ups-actions{display:flex;align-items:center;gap:14px;padding-top:17px}.ups-actions button{border:0;border-radius:8px;padding:12px 24px;font-size:1em;font-weight:700;cursor:pointer;background:#27303f;color:var(--text)}.ups-actions button.primary{background:var(--ups-accent);color:#071426}.ups-actions button:disabled{opacity:.6;cursor:wait}.ups-result{color:var(--muted);margin-left:2px}.ups-notice{min-height:94px}.ups-notice p{color:var(--muted);font-size:1.0625em;margin:0}@media(max-width:900px){.dashboard-container{padding:24px 18px}.ups-connection,.ups-stats{grid-template-columns:repeat(2,1fr)}.ups-table-head{display:none}.ups-vm-row{grid-template-columns:42px 1fr 130px 140px;gap:8px}.ups-vm-row>.timeout{grid-column:3}.ups-vm-row>.ups-status{grid-column:2}.ups-policy{flex-wrap:wrap;gap:14px}}@media(max-width:600px){.ups-connection,.ups-stats{grid-template-columns:1fr}.ups-vm-row{grid-template-columns:32px 1fr}.ups-vm-row>.ups-status,.ups-vm-row>.schedule,.ups-vm-row>.timeout{grid-column:2}.ups-actions{flex-wrap:wrap}}
  </style>
  <style>
    body.ups-app{max-width:none;margin:0 auto;padding:38px 60px 48px;box-sizing:border-box;overflow-x:hidden}
    body.ups-app .ups-connections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;margin-top:30px}
    body.ups-app .ups-connections .ups-section{margin-top:0}
    body.ups-app .ups-card{padding:22px}
    body.ups-app .ups-connection{min-width:0;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 18px}
    body.ups-app .ups-connection h2{font-size:1.25em}
    body.ups-app .ups-connection textarea{grid-column:1/-1}
    body.ups-app > .ups-section{margin-top:26px}
    body.ups-app .ups-stats{margin-top:26px}
    body.ups-app .ups-vm-card{padding:22px 22px 17px}
    body.ups-app .ups-notice{min-height:110px}
    body.ups-app .ups-empty{grid-column:1/-1;padding:24px 8px;color:var(--muted);font-size:1em}
    body.ups-app .ups-refresh{margin-left:auto;color:var(--muted);font-size:.875em}
    body.ups-app .ssh-actions{display:flex;align-items:center;gap:14px;grid-column:1/-1;margin-top:2px}.ssh-status{color:var(--muted);font-size:.875em}.ssh-status.pending{color:#d5a431}.ssh-status.success{color:#35d98b}.ssh-status.error{color:#e87575}
    @media(max-width:900px){body.ups-app{padding:28px 18px 36px}body.ups-app .ups-connections{grid-template-columns:1fr;gap:20px}body.ups-app .ups-connection{gap:14px}}
  </style>
  <style>
    /* Keep app-specific layout, but inherit all card surfaces from mikrotik-ui-shared. */
    body.ups-app .ups-card{background:var(--card);border:0.5px solid var(--border);border-radius:20px;padding:12px;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow),var(--glass-inset)}
  </style>
</head>
<body class="ups-app">
  <header class="topbar" data-mikrotik-header-root data-brand="nut" data-brand-text="Proxmox NUT Policy GUI" data-brand-version="" data-subtitle=""></header>

  <div class="ups-connections">
  <section class="card ups-card ups-connection ups-section">
    <h2 data-i18n="proxmoxConnection"></h2>
    <label><span data-i18n="sshHost"></span><input id="ssh-host" value="192.168.88.120"></label>
    <label><span data-i18n="sshPort"></span><input id="ssh-port" type="number" min="1" max="65535" value="22"></label>
    <label><span data-i18n="sshUser"></span><input id="ssh-user" value="root"></label>
    <label><span data-i18n="sshAuthMethod"></span><select id="ssh-auth-method"><option value="key" data-i18n="sshAuthKey"></option><option value="password" data-i18n="sshAuthPassword"></option></select></label>
    <label><span data-i18n="sshKey"></span><textarea id="ssh-key" rows="4" data-i18n-placeholder="sshKeyPlaceholder" placeholder=""></textarea></label>
  <label><span data-i18n="sshPassword"></span><input id="ssh-password" type="password" autocomplete="new-password" data-i18n-placeholder="sshPasswordPlaceholder" placeholder=""></label>
  <div class="ssh-actions"><button class="primary" id="save-ssh" type="button" data-i18n="saveSettings"></button><button id="test-ssh" type="button" data-i18n="testSsh"></button><span class="ssh-status" id="ssh-status" data-i18n="sshNotTested"></span></div>
  </section>

  </div>

  <section class="ups-stats ups-section"><div class="ups-card ups-stat"><div class="ups-label" data-i18n="upsStatus"></div><div class="ups-value" id="ups-status-value">--</div></div><div class="ups-card ups-stat"><div class="ups-label" data-i18n="battery"></div><div class="ups-value" id="ups-battery-value">--</div></div><div class="ups-card ups-stat"><div class="ups-label" data-i18n="autonomy"></div><div class="ups-value" id="ups-runtime-value">--</div></div><div class="ups-card ups-stat"><div class="ups-label" data-i18n="loadUps"></div><div class="ups-value" id="ups-load-value">--</div></div></section><section class="ups-card ups-section"><h2 data-i18n="upsDetails"></h2><p><span data-i18n="upsModel"></span>: <span id="ups-model-value">--</span> · <span data-i18n="upsVendor"></span>: <span id="ups-vendor-value">--</span> · <span data-i18n="upsName"></span>: <span id="ups-name-value">--</span></p></section>
  <section class="ups-card ups-policy ups-section"><h2 data-i18n="shutdownPolicy"></h2><p><span data-i18n="shutdownWith"></span> <input class="ups-input" id="battery-minutes" type="number" min="0" value="5"> <span data-i18n="minutesRemaining"></span></p></section>
  <section class="ups-card ups-vm-card ups-section"><h2 data-i18n="vms"></h2><div class="ups-table-head"><div data-i18n="active"></div><div data-i18n="vm"></div><div data-i18n="status"></div><div data-i18n="shutdownAt"></div><div data-i18n="timeout"></div></div><div id="vm-list"></div><div class="ups-actions"><button class="primary" id="deploy" data-i18n="saveDeploy"></button><button id="test" data-i18n="testPolicy"></button><button id="refresh-vms" data-i18n="refreshVms"></button><span class="ups-result" id="result" data-i18n="lastDeploy"></span></div></section>
  <section class="ups-card ups-notice ups-section"><h2 data-i18n="failSafe"></h2><p data-i18n="failSafeText"></p></section>

  <script src="/common/dropdown-utils.js"></script>
  <script src="/common/header.js"></script>
  <script>
    const formState={},list=document.querySelector('#vm-list'),result=document.querySelector('#result');let translations={},headerMeta={version:''};
    function t(k){return translations[k]||k}
    function applyText(){document.querySelectorAll('[data-i18n]').forEach(e=>{e.innerHTML=t(e.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>{const key=e.dataset.i18nPlaceholder;if(key)e.placeholder=t(key)})}
    function syncChrome(){const lang=window.MikroTikSharedHeader?.getState?.().language||'en';const root=document.querySelector('[data-mikrotik-header-root]');if(root){root.dataset.brandText=t('pageTitle')}const brandTextEl=document.querySelector('#brand-text');if(brandTextEl)brandTextEl.textContent=t('pageTitle');document.documentElement.lang=lang;document.title=headerMeta.version?`${t('pageTitle')} · ${headerMeta.version}`:t('pageTitle')}
    async function loadAppLanguage(){translations=window.MikroTikSharedHeader?.translations||window.MikroTikSharedHeader?.fallbackTranslations||{};applyText();setHeaderMeta(formState,headerMeta);render(formState,formState.inventory||[]);await loadUpsStatus()}
    function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
    function render(c,vms=[]){[['ssh-host','ssh_host'],['ssh-port','ssh_port'],['ssh-user','ssh_user'],['ssh-auth-method','ssh_auth_method'],['ssh-key','ssh_key'],['shutdown-command','shutdown_command']].forEach(([id,key])=>{const el=document.querySelector('#'+id);if(el&&c[key]!==undefined)el.value=c[key]});const policies=new Map((c.containers||[]).map(x=>[String(x.vmid),x]));list.innerHTML='';if(!vms.length){list.innerHTML=`<div class="ups-empty">${t('noVms')}</div>`;return}vms.forEach(x=>{const vmid=x.vmid,policy=policies.get(String(vmid))||{},enabled=policy.enabled!==undefined?!!policy.enabled:policy.status==='running',status=x.status||'unknown',statusKey=status==='running'||status==='stopped'?status:'unknown',row=document.createElement('div');row.className='ups-vm-row';row.innerHTML=`<input class="ups-check" type="checkbox" ${enabled?'checked':''} data-vmid="${esc(vmid)}" data-type="${esc(x.type||'qemu')}" data-node="${esc(x.node||'')}" data-name="${esc(x.name||('VM '+vmid))}"><div><div class="ups-vm-name">${esc(x.name||('VM '+vmid))}</div><div class="ups-vm-meta">${esc(t('id'))} ${esc(vmid)} · ${esc(x.type||'qemu')} · ${esc(x.node||'')}</div></div><div class="ups-status ${statusKey==='running'?'running':'stopped'}">${t(statusKey)}</div><div class="ups-field schedule"><input class="ups-input shutdown" type="number" min="0" value="${policy.shutdown_after_minutes??(policy.delay?Math.round(policy.delay/60):15)}"><span>${t('min')}</span></div><div class="ups-field timeout"><input class="ups-input timeout-value" type="number" min="0" value="${policy.timeout||180}"><span>${t('sec')}</span></div>`;list.append(row)})}
    function read(){return [...list.querySelectorAll('.ups-vm-row')].map(r=>{const check=r.querySelector('.ups-check');return{vmid:+check.dataset.vmid,type:check.dataset.type,node:check.dataset.node,name:check.dataset.name,delay:(+r.querySelector('.shutdown').value||0)*60,shutdown_after_minutes:+r.querySelector('.shutdown').value||0,timeout:+r.querySelector('.timeout-value').value||180,enabled:check.checked,status:r.querySelector('.ups-status').textContent}})}
    async function send(url){result.textContent=t('working');document.querySelectorAll('.ups-actions button').forEach(b=>b.disabled=true);const c={...formState,ssh_host:document.querySelector('#ssh-host').value,ssh_port:+document.querySelector('#ssh-port').value,ssh_user:document.querySelector('#ssh-user').value,ssh_auth_method:document.querySelector('#ssh-auth-method').value,ssh_key:document.querySelector('#ssh-key').value,ssh_password:document.querySelector('#ssh-password').value||formState.ssh_password||'',containers:read()};const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c),signal:controller.signal}),j=await r.json();if(!r.ok||!j.ok){if(j.saved){result.textContent=t('savedLocally')+' '+t('publishFailed')+': '+(j.error||'');return}throw new Error(j.error||j.errors?.join(', ')||t('connectionError'))}if(url.includes('/api/apply'))setHeaderMeta(c,headerMeta);result.textContent=url.includes('/api/test-policy')?t('policyOk'):t('deployOk')}catch(e){result.textContent=e.name==='AbortError'?t('connectionError'):t('error')+(e.message||'')}finally{clearTimeout(timer);document.querySelectorAll('.ups-actions button').forEach(b=>b.disabled=false)}}
        function setHeaderMeta(config,meta){headerMeta={version:meta?.version||headerMeta.version||''};const root=document.querySelector('[data-mikrotik-header-root]');const version=headerMeta.version;const subtitle=config?.ssh_host?`${config.ssh_host} · ${t('vmShutdownRules')}`:t('vmShutdownRules');if(root){root.dataset.brandVersion=version;root.dataset.subtitle=subtitle}const versionEl=document.querySelector('#brand-version');const subtitleEl=document.querySelector('#subtitle');if(versionEl)versionEl.textContent=version;if(subtitleEl)subtitleEl.textContent=subtitle;document.title=version?`${t('pageTitle')} · ${version}`:t('pageTitle');syncChrome()}    async function loadUpsStatus(){const statusEl=document.querySelector('#ups-status-value');const batteryEl=document.querySelector('#ups-battery-value');const runtimeEl=document.querySelector('#ups-runtime-value');const loadEl=document.querySelector('#ups-load-value');const modelEl=document.querySelector('#ups-model-value');const vendorEl=document.querySelector('#ups-vendor-value');const nameEl=document.querySelector('#ups-name-value');try{const r=await fetch('/api/ups/status',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||t('loadUpsError'));const s=j.status||{};if(statusEl)statusEl.textContent=s.ups_status||t('unknown');if(batteryEl)batteryEl.textContent=s.battery_charge!=null?s.battery_charge+'%':'--';if(runtimeEl)runtimeEl.textContent=s.battery_runtime_min!=null?Number(s.battery_runtime_min).toFixed(1)+' '+t('min'):'--';if(loadEl)loadEl.textContent=s.ups_load!=null?s.ups_load+'%':'--';if(modelEl)modelEl.textContent=s.device_model||'--';if(vendorEl)vendorEl.textContent=s.device_vendor||'--';if(nameEl)nameEl.textContent=s.ups_name||'--'}catch(_){if(statusEl)statusEl.textContent=t('loadUpsError');if(batteryEl)batteryEl.textContent='--';if(runtimeEl)runtimeEl.textContent='--';if(loadEl)loadEl.textContent='--';if(modelEl)modelEl.textContent='--';if(vendorEl)vendorEl.textContent='--';if(nameEl)nameEl.textContent='--'}}
    async function loadVms(){const button=document.querySelector('#refresh-vms');button.disabled=true;try{const r=await fetch('/api/proxmox/vms',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||t('loadVmsError'));formState.inventory=j.vms||[];render(formState,formState.inventory)}catch(e){list.innerHTML=`<div class="ups-empty">${esc(e.message)}</div>`}finally{button.disabled=false}}
    async function testSsh(){const s=document.querySelector('#ssh-status');s.textContent=t('sshTesting');s.className='ssh-status pending';const c={...formState,ssh_host:document.querySelector('#ssh-host').value,ssh_port:+document.querySelector('#ssh-port').value,ssh_user:document.querySelector('#ssh-user').value,ssh_auth_method:document.querySelector('#ssh-auth-method').value,ssh_key:document.querySelector('#ssh-key').value,ssh_password:document.querySelector('#ssh-password').value||formState.ssh_password||''};try{const r=await fetch('/api/test-connection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||t('connectionFailed'));s.textContent=t('sshConnected');s.className='ssh-status success'}catch(e){s.textContent=t('connectionFailed');s.className='ssh-status error'}}
    async function saveConnection(){const s=document.querySelector('#ssh-status');s.textContent=t('working');s.className='ssh-status pending';const c={...formState,ssh_host:document.querySelector('#ssh-host').value,ssh_port:+document.querySelector('#ssh-port').value,ssh_user:document.querySelector('#ssh-user').value,ssh_auth_method:document.querySelector('#ssh-auth-method').value,ssh_key:document.querySelector('#ssh-key').value,ssh_password:document.querySelector('#ssh-password').value||formState.ssh_password||'',containers:read()};const b=document.querySelector('#save-ssh');b.disabled=true;try{const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||j.errors?.join(', ')||t('connectionError'));Object.assign(formState,c);s.textContent=t('settingsSaved');s.className='ssh-status success'}catch(e){s.textContent=t('error')+(e.message||'');s.className='ssh-status error'}finally{b.disabled=false}}
    const sharedReady=window.MikroTikSharedHeader?.ready||window.MikroTikSharedHeader?.whenReady?.();if(sharedReady?.then)sharedReady.then(loadAppLanguage);window.addEventListener('mikrotik:header-ready',loadAppLanguage,{once:true});window.addEventListener('mikrotik:header-setting-changed',e=>{if(e.detail?.key==='language')loadAppLanguage()});document.querySelector('#save-ssh').onclick=saveConnection;document.querySelector('#test-ssh').onclick=testSsh;document.querySelector('#deploy').onclick=()=>send('/api/apply');document.querySelector('#test').onclick=()=>send('/api/test-policy');document.querySelector('#refresh-vms').onclick=loadVms;Promise.all([fetch('/api/config'),fetch('/api/meta')]).then(async([configRes,metaRes])=>{const c=await configRes.json();const meta=await metaRes.json();Object.assign(formState,c);setHeaderMeta(c,meta);return loadVms().then(loadUpsStatus).then(()=>setInterval(loadUpsStatus,30000))}).catch(e=>{document.querySelector('#vm-list').innerHTML=`<div class="ups-empty">${esc(e.message||t('loadVmsError'))}</div>`});
  </script>
</body></html>
